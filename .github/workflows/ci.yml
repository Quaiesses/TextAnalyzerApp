name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TextAnalyzerApp.Tests/TextAnalyzerApp.Tests.csproj

      - name: Build
        run: dotnet build TextAnalyzerApp.Tests/TextAnalyzerApp.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test TextAnalyzerApp.Tests/TextAnalyzerApp.Tests.csproj --no-build --configuration Release --verbosity normal
